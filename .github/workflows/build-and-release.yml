name: Build ESP32 Pixel Clock Firmware

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 PlatformIO Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🚀 Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: ⚙️ Build Firmware (PlatformIO)
        run: |
          mkdir -p include firmware/include
          if [ ! -f "include/secrets.h" ]; then
            echo '#pragma once' > include/secrets.h
            echo 'constexpr const char* WIFI_SSID = "YourWiFi";' >> include/secrets.h
            echo 'constexpr const char* WIFI_PASS = "YourPass";' >> include/secrets.h
            echo 'constexpr const char* MQTT_SERVER = "192.168.1.180";' >> include/secrets.h
            echo 'constexpr int MQTT_PORT = 1883;' >> include/secrets.h
            echo 'constexpr const char* MQTT_USER = "mqtt_user";' >> include/secrets.h
            echo 'constexpr const char* MQTT_PASS = "mqtt_pass";' >> include/secrets.h
            echo 'constexpr const char* OTA_USER = "admin";' >> include/secrets.h
            echo 'constexpr const char* OTA_PASS = "admin123";' >> include/secrets.h
          fi
          if [ ! -f "firmware/include/secrets.h" ]; then
            cp include/secrets.h firmware/include/secrets.h
          fi
          pio run -e esp32dev

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-pixel-clock-firmware
          path: |
            .pio/build/esp32dev/firmware.bin
            .pio/build/esp32dev/partitions.bin
            .pio/build/esp32dev/bootloader.bin
          if-no-files-found: error
          retention-days: 14

      - name: 🏷️ Publish Release (GitHub CLI)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="latest"
          fi
          echo "Publishing release with tag: $TAG"

          gh release create "$TAG" \
            .pio/build/esp32dev/firmware.bin \
            .pio/build/esp32dev/partitions.bin \
            .pio/build/esp32dev/bootloader.bin \
            --title "Release $TAG" \
            --notes "Свежая сборка прошивки firmware.bin для ESP32 Pixel Clock" \
            --clobber || echo "Release updated or created"
