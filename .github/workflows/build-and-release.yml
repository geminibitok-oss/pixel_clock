name: Build ESP32 Pixel Clock Firmware

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🔨 PlatformIO Build
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Cache PlatformIO & packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            .pio
          key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: 🚀 Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: 🔐 Prepare secrets.h for compilation
        run: |
          # Создаем secrets.h в include и firmware/include, если они не существуют
          mkdir -p include firmware/include firmware/src src

          make_secret() {
            local target_dir="$1"
            if [ ! -f "$target_dir/secrets.h" ]; then
              cat << 'EOF' > "$target_dir/secrets.h"
#pragma once
constexpr const char* WIFI_SSID = "${{ secrets.WIFI_SSID || "YourWiFi" }}";
constexpr const char* WIFI_PASS = "${{ secrets.WIFI_PASS || "YourPass" }}";
constexpr const char* MQTT_SERVER = "${{ secrets.MQTT_SERVER || "192.168.1.180" }}";
constexpr int MQTT_PORT = 1883;
constexpr const char* MQTT_USER = "${{ secrets.MQTT_USER || "mqtt_user" }}";
constexpr const char* MQTT_PASS = "${{ secrets.MQTT_PASS || "mqtt_pass" }}";
constexpr const char* OTA_USER = "${{ secrets.OTA_USER || "admin" }}";
constexpr const char* OTA_PASS = "${{ secrets.OTA_PASS || "admin123" }}";
EOF
              echo "Created temporary secrets.h in $target_dir"
            fi
          }

          make_secret "include"
          make_secret "firmware/include"
          make_secret "firmware/src"

      - name: ⚙️ Build Firmware Binary (PlatformIO)
        run: |
          if [ -f "platformio.ini" ]; then
            pio run -e esp32dev
          elif [ -f "firmware/platformio.ini" ]; then
            cd firmware && pio run -e esp32dev && cd ..
          fi

      - name: 🔍 Locate Built Binaries
        id: locate_bin
        run: |
          BIN_PATH=$(find .pio -name "firmware.bin" | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "::error::firmware.bin not found after build!"
            exit 1
          fi
          echo "Found firmware.bin at: $BIN_PATH"
          echo "bin_path=$BIN_PATH" >> "$GITHUB_OUTPUT"

          BOOTLOADER_PATH=$(find .pio -name "bootloader.bin" | head -n 1)
          echo "bootloader_path=$BOOTLOADER_PATH" >> "$GITHUB_OUTPUT"

          PARTITIONS_PATH=$(find .pio -name "partitions.bin" | head -n 1)
          echo "partitions_path=$PARTITIONS_PATH" >> "$GITHUB_OUTPUT"

      - name: 📦 Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esp32-pixel-clock-firmware
          path: |
            ${{ steps.locate_bin.outputs.bin_path }}
            ${{ steps.locate_bin.outputs.partitions_path }}
            ${{ steps.locate_bin.outputs.bootloader_path }}
          if-no-files-found: error
          retention-days: 14

      - name: 🏷️ Release on Version Tag (v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.locate_bin.outputs.bin_path }}
            ${{ steps.locate_bin.outputs.partitions_path }}
            ${{ steps.locate_bin.outputs.bootloader_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Release/Update 'latest' on Push to main
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Automated Build
          body: |
            Автоматическая сборка прошивки ESP32 Pixel Clock из коммита ${{ github.sha }}.
            Бинарник `firmware.bin` готов для загрузки по воздуху (GitHub OTA).
          draft: false
          prerelease: false
          files: |
            ${{ steps.locate_bin.outputs.bin_path }}
            ${{ steps.locate_bin.outputs.partitions_path }}
            ${{ steps.locate_bin.outputs.bootloader_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
